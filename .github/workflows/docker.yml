name: 🐋 Build and Push Docker Image

on:
    push:
        branches:
            - main
        paths:
            - ".github/workflows/docker.yml"
            - "Dockerfile"
            - "**/package.json"
            - "packages/*/src/**"
            - "apps/*/src/**"

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build_and_push:
        runs-on: ubuntu-latest

        steps:
            - name: 📥 Checkout repository
              uses: actions/checkout@v7

            - name: 🏷️ Get short SHA
              id: sha
              run: echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

            - name: 🔽 Set up Docker Buildx
              id: buildx
              uses: docker/setup-buildx-action@v4

            - name: ✅ Log in to DockerHub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: 📦 Cache RUN --mount=type=cache dirs
              id: cache-mounts
              uses: actions/cache@v4
              with:
                  path: cache-mounts
                  key: cache-mounts-${{ hashFiles('Dockerfile', 'bun.lock') }}
                  restore-keys: |
                      cache-mounts-

            - name: ⏪ Restore Docker cache mounts
              uses: reproducible-containers/buildkit-cache-dance@v3
              with:
                  builder: ${{ steps.buildx.outputs.name }}
                  cache-dir: cache-mounts
                  dockerfile: Dockerfile
                  skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit }}

            - name: 🔨 Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/msdbot_telegram:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      GIT_COMMIT=${{ steps.sha.outputs.short_sha }}
